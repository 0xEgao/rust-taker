[package]
name = "rust-taker"
version = "0.1.0"
description = "Coinswap Taker desktop app (Tauri + React)"
edition = "2021"
license = "MIT"

[lib]
name = "rust_taker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
minreq = { version = "2.12.0", features = ["https"] }
coinswap = { git = "https://github.com/mojoX911/coinswap", rev = "4f36e684c4995e0a75d4de127de0739578082d19" }
libtor = { version = "47.13", features = ["vendored-openssl"], optional = true }

[features]
default = ["embedded-tor"]
embedded-tor = ["dep:libtor"]

