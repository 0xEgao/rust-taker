[package]
name = "portal"
version = "0.1.0"
description = "Portal desktop app (Tauri + React)"
edition = "2021"
license = "MIT"

[lib]
name = "portal_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
log = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
libc = "0.2"
minreq = { version = "2.12.0", features = ["https"] }
# Decodes Tor's `tor/hostname` file in the maker's data dir — same format coinswap itself uses.
serde_cbor = "0.11.2"
# Own logger config (see src/logging.rs) — coinswap's setup_taker_logger/setup_maker_logger
# share one process-wide OnceLock, so we can't use both to get two separate log files.
log4rs = "1.4.0"
coinswap = { git = "https://github.com/citadel-tech/coinswap", branch = "master" }
libtor = { version = "47.13", features = ["vendored-openssl"], optional = true }
tauri-plugin-single-instance = "2"

[features]
# Keep the in-app Tor fallback enabled. Users with an external Tor continue to
# use their own process and authentication choice; users without one can still
# start Portal without installing Tor separately.
default = ["embedded-tor"]
embedded-tor = ["dep:libtor"]
