name: Build downloadable apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }} apps
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: x86_64-unknown-linux-gnu
            desktop_bundles: appimage,deb,rpm
            server_artifact: portal-server-linux-x86_64
            desktop_artifact_prefix: portal-desktop-linux-x86_64
          - name: macOS Apple Silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
            desktop_bundles: dmg
            server_artifact: portal-server-macos-apple-silicon
            desktop_artifact_prefix: portal-desktop-macos-apple-silicon

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            pkg-config \
            xdg-utils

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        run: brew install automake autoconf libtool pkg-config

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.2
        with:
          shared-key: ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload Portal Desktop packages
        uses: tauri-apps/tauri-action@v1.0.0
        env:
          # Ad-hoc signing keeps unsigned macOS artifacts launchable after download.
          APPLE_SIGNING_IDENTITY: "-"
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.desktop_bundles }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: ${{ matrix.desktop_artifact_prefix }}-[bundle]

      - name: Build Portal Server
        run: npm run web:build -- --target ${{ matrix.target }}

      - name: Package Portal Server
        shell: bash
        env:
          PACKAGE_NAME: ${{ matrix.server_artifact }}
          RUST_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          package_dir="${RUNNER_TEMP}/${PACKAGE_NAME}"
          mkdir -p "${package_dir}/assets"
          install -m 755 "target/${RUST_TARGET}/release/portal-web" "${package_dir}/portal-server"
          cp -R dist/web/. "${package_dir}/assets/"
          tar -C "${RUNNER_TEMP}" -czf "${RUNNER_TEMP}/${PACKAGE_NAME}.tar.gz" "${PACKAGE_NAME}"

      - name: Upload Portal Server package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.server_artifact }}
          path: ${{ runner.temp }}/${{ matrix.server_artifact }}.tar.gz
          if-no-files-found: error
          compression-level: 0
