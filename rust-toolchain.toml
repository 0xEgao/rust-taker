# One compiler everywhere: local builds, every CI workflow and the container image. A floating
# `stable` let CI pick up lints a local run never saw. Bump the channel together with the
# `dtolnay/rust-toolchain@` refs in .github/workflows and the `rust:` tag in umbrel/Dockerfile.
[toolchain]
channel = "1.98.0"
components = ["clippy"]
profile = "minimal"
